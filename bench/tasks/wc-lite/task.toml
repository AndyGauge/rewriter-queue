name = "wc-lite"
description = "Greenfield stdin counter printing lines, words and bytes; edge cases around empty input, missing trailing newline and repeated whitespace"
max_iter = 8
time_budget_secs = 1800
tags = ["greenfield", "cli", "stdin", "edge-cases", "difficulty:easy"]
binary = "wc-lite"

[[check]]
name = "empty-input"
stdin = ""
expect_stdout = "0 0 0\n"
expect_stderr = ""
expect_exit = 0

[[check]]
name = "one-line"
stdin = "hello world\n"
expect_stdout = "1 2 12\n"
expect_stderr = ""
expect_exit = 0

[[check]]
name = "no-trailing-newline"
stdin = "a b c"
expect_stdout = "0 3 5\n"
expect_exit = 0

[[check]]
name = "multiple-spaces"
stdin = "  a   b  \n\n"
expect_stdout = "2 2 11\n"
expect_exit = 0

[[check]]
name = "only-newline"
stdin = "\n"
expect_stdout = "1 0 1\n"
expect_exit = 0

[[check]]
name = "tabs-separate-words"
stdin = "a\tb\n"
expect_stdout = "1 2 4\n"
expect_exit = 0

[[check]]
name = "crlf-line-endings"
stdin = "a\r\nb\r\n"
expect_stdout = "2 2 6\n"
expect_exit = 0

[[check]]
name = "multibyte-counts-bytes"
stdin = "héllo wörld\n"
expect_stdout = "1 2 14\n"
expect_exit = 0

[[check]]
name = "several-lines"
stdin = "one\ntwo words\n\nthree small words\n"
expect_stdout = "4 6 33\n"
expect_stderr = ""
expect_exit = 0

[[check]]
name = "only-whitespace"
stdin = " \t \n \n"
expect_stdout = "2 0 6\n"
expect_exit = 0
