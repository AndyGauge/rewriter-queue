[workspace]
members = [
    "ai-org-orchestrator",
    "inference-providers",
    "job-queue",
    "run-events",
    "bench",
    "snippet-graph",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
ureq = { version = "2", features = ["json"] }
toml = "0.8"
thiserror = "1"
syn = { version = "2", features = ["full", "visit", "visit-mut", "extra-traits"] }
