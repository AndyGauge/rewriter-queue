[package]
name = "ai-org-orchestrator"
version = "0.4.0"
edition = "2021"
description = "Token-aware multi-agent orchestrator for V1→V2 code synthesis"
license = "MIT OR Apache-2.0"

[[bin]]
name = "ai-org-orchestrator"
path = "src/main.rs"

[dependencies]
serde_json           = { workspace = true }
toml                 = { workspace = true }
chrono               = { workspace = true }
